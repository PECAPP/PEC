# ── Dev virtual host ─────────────────────────────────────────────────────────
# Frontend runs on the HOST machine via `npm run dev` (port 3001).
# IMPORTANT: Do NOT proxy /api/* here. Next.js rewrites handle the path
# transformation (/api/* → /api/v1/*) before forwarding to the backend.
# Nginx only needs to forward everything to Next.js.

upstream frontend_local_dev {
    # host.docker.internal resolves to the host machine from inside Docker.
    # On Linux, Docker doesn't add this automatically — we inject it via
    # extra_hosts in docker-compose.dev.yml.
    server host.docker.internal:3001;
    keepalive 8;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 50M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          SAMEORIGIN;
    add_header X-Content-Type-Options   nosniff;
    add_header Referrer-Policy          strict-origin-when-cross-origin;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:;";
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Everything goes to Next.js ─────────────────────────────────────────────
    # Next.js handles:
    #   - /api/*      → rewrites to backend with /v1/ prefix injected
    #   - /socket.io/ → proxied via INTERNAL_API_URL
    #   - all pages   → SSR / static
    
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://frontend_local_dev;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   traceparent       $http_traceparent;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://frontend_local_dev;
        proxy_http_version 1.1;
        # WebSocket support (Next.js HMR Fast Refresh + Socket.IO)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   traceparent       $http_traceparent;
        proxy_read_timeout 120s;
    }
}
