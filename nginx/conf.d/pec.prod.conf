# ── Prod virtual host ─────────────────────────────────────────────────────────
# Everything runs inside Docker. Frontend container serves on :3001.
# IMPORTANT: Do NOT proxy /api/* here. Next.js rewrites handle the path
# transformation (/api/* → /api/v1/*) before forwarding to the backend.
# Next.js uses INTERNAL_API_URL=http://backend:4000/api for SSR calls.

upstream frontend_next {
    server frontend:3001;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# Uncomment when you have a certificate.
#
# server {
#     listen 80;
#     server_name pec.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;   # replace with your domain when enabling SSL

    # ── SSL (uncomment when cert is available) ────────────────────────────────
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 1d;

    client_max_body_size 50M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          SAMEORIGIN;
    add_header X-Content-Type-Options   nosniff;
    add_header Referrer-Policy          strict-origin-when-cross-origin;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:;";
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Everything goes to Next.js ────────────────────────────────────────────
    # Next.js handles:
    #   - /api/*      → rewrites to backend with /v1/ prefix injected
    #   - /socket.io/ → proxied via INTERNAL_API_URL=http://backend:4000
    #   - all pages   → SSR / static
    location / {
        proxy_pass         http://frontend_next;
        proxy_http_version 1.1;
        # WebSocket support (Socket.IO + Next.js HMR if ever needed)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   traceparent       $http_traceparent;
        proxy_read_timeout 120s;
    }
}
