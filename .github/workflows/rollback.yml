name: Rollback Production Deployment

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'The Git SHA tag of the image to rollback to (e.g. 8a7b6c5)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag Backend Image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.event.inputs.target_sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.event.inputs.target_sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Retag Frontend Image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.event.inputs.target_sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.event.inputs.target_sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      - name: Trigger Server Webhook
        run: |
          # Replace with your server's deploy webhook URL if applicable
          echo "Rollback pushed. Please trigger a deployment (e.g. docker compose pull && docker compose up -d) on your production server."
