name: Flutter Mobile CI (Melos)

on:
  push:
    paths:
      - 'mobile/**'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap
        working-directory: mobile

      - name: Analyze Code
        run: melos run analyze
        working-directory: mobile

      - name: Run Tests
        run: melos run test
        working-directory: mobile
