  dev_worker:
    image: node:22-alpine
    container_name: pec_dev_worker
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pec
      REPLICA_URL: postgresql://postgres:postgres@postgres:5432/pec
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/pec
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "corepack enable pnpm && pnpm install && npx ts-node apps/server/src/background-jobs/worker.ts"
    networks:
      - pec-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
volumes:
  postgres_data: null
networks:
  pec-network:
    driver: bridge
