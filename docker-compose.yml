name: pec-erp
services:
  postgres:
    image: postgres:16-alpine
    container_name: pec_postgres
    restart: always
    environment:
      POSTGRES_DB: "pec"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: PECApp-Backend
    restart: always
    ports:
      - "4000:4000"
      - "50051:50051"
    environment:
      JWT_SECRET: "pec_secret_key_2026"
      PORT: "4000"
      NODE_ENV: "development"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pec"
    command: >
      sh -c " cd /app/packages/database && npx prisma db push --accept-data-loss && cd /app/apps/server && npm run db:seed && node dist/src/main "
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.27-latest
    container_name: pec_envoy
    ports:
      - "8080:8080"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: PECApp-Frontend
    restart: always
    ports:
      - "3000:3001" # Host listens on 3000, forwards to container's 3001
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
      INTERNAL_API_URL: "http://backend:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
