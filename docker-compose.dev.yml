name: pec-erp-dev

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pec_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pec}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    command: ["postgres", "-c", "statement_timeout=5000", "-c", "autovacuum_vacuum_scale_factor=0.05", "-c", "autovacuum_analyze_scale_factor=0.02", "-c", "wal_level=logical"]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - pec-network
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d pec
      interval: 10s
      timeout: 5s
      retries: 5

  pg_backup:
    image: postgres:16-alpine
    container_name: pec_pg_backup_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pec}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
    command: >
      sh -c '
      echo "Backup service started.";
      while true; do
        sleep 86400;
        echo "Running daily backup...";
        pg_dump -U $$POSTGRES_USER -d $$POSTGRES_DB -f /backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
        echo "Backup complete.";
        # Keep only the last 7 backups
        ls -t /backups/backup_*.sql | tail -n +8 | xargs -r rm --;
      done'
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    networks:
      - pec-network
    logging: *default-logging

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pec_pgbouncer_dev
    environment:
      AUTH_TYPE: scram-sha-256
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-pec}
      POOL_MODE: session
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - 6432:5432
    depends_on:
      - postgres
    networks:
      - pec-network
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: pec_redis_dev
    restart: always
    ports:
      - 6379:6379
    # Use volatile-lru so standard caching works correctly when memory is full.
    # Blacklisted tokens should be managed by DB/TTL instead of relying on noeviction
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    networks:
      - pec-network
    logging: *default-logging
    healthcheck:
      # redis-cli ping uses `docker exec` which hits a Windows/WSL2 OCI fork bug.
      # TCP check is equivalent and works on all platforms.
      test: ["CMD-SHELL", "echo '' | nc -w 1 localhost 6379 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pec_rabbitmq_dev
    restart: always
    environment:
      - RABBITMQ_ERLANG_COOKIE=pec_dev_cookie_secret
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - pec-network
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  deps_installer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pec_deps_installer_dev
    working_dir: /app
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - pnpm_store_dev:/app/.pnpm-store
      - server_node_modules:/app/apps/server/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
      - database_node_modules:/app/packages/database/node_modules
    # Fix #20: Always re-run pnpm install so lockfile changes are picked up.
    # pnpm's content-addressable store makes this fast on cache hits.
    command: >-
      sh -c "pnpm config set store-dir /app/.pnpm-store &&
      pnpm install --config.confirmModulesPurge=false"
    networks:
      - pec-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pec_backend_dev
    working_dir: /app
    restart: always
    ports:
      - 4000:4000
      - 50052:50051
    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: "4000"
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-pec}?pgbouncer=true
      REPLICA_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-pec}?pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pec}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      BCRYPT_ROUNDS: "12"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_BUCKET: pec-uploads
      # Allow both the Nginx gateway (port 80) and the direct Next.js dev server (port 3001).
      # http://localhost     → browser via Nginx (dev + prod-like)
      # http://localhost:3001 → browser direct to Next.js (fallback / testing)
      CORS_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
      - database_node_modules:/app/packages/database/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "cd /app/packages/database && pnpm exec prisma generate && DATABASE_URL=$$DIRECT_URL pnpm exec prisma db push --accept-data-loss && cd /app/apps/server && pnpm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      deps_installer:
        condition: service_completed_successfully
    # Fix #22: Healthcheck now hits /api/v1/health (proper endpoint) rather than root path.
    # This catches the case where the process is up but all routes are returning 500.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4000/api/v1/health', (res) => { process.exit(res.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - pec-network
    logging: *default-logging

  # Envoy removed — frontend uses REST + Socket.IO only (no gRPC-Web).

  # Frontend is intentionally NOT containerized in dev.
  # Run it on your host with: cd apps/frontend && pnpm run dev
  # Nginx will proxy localhost:80 → host.docker.internal:3001 for you.

  nginx:
    image: nginx:1.27-alpine
    container_name: pec_nginx_dev
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/pec.dev.conf:/etc/nginx/conf.d/default.conf:ro
    command: >
      sh -c "apk add --no-cache openssl &&
      mkdir -p /etc/nginx/ssl &&
      if [ ! -f /etc/nginx/ssl/nginx.crt ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/nginx.key -out /etc/nginx/ssl/nginx.crt -subj '/CN=localhost';
      fi &&
      nginx -g 'daemon off;'"
    # host.docker.internal is needed to reach the frontend on the host machine.
    # Docker Desktop (Win/Mac) provides this automatically.
    # On Linux hosts it must be injected explicitly:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pec-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  dev_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pec_dev_worker_dev
    working_dir: /app
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - server_node_modules:/app/apps/server/node_modules
      - database_node_modules:/app/packages/database/node_modules
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-pec}?pgbouncer=true
      REPLICA_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-pec}?pgbouncer=true
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pec}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      deps_installer:
        condition: service_completed_successfully
      # Fix #21: Worker waits for backend to be healthy so it doesn't fire
      # events before backend consumers are registered.
      backend:
        condition: service_healthy
    command: >
      sh -c "cd /app/packages/database && pnpm exec prisma generate &&
      cd /app && pnpm exec tsx watch apps/server/src/background-jobs/worker.ts"
    networks:
      - pec-network
    logging: *default-logging

  clamav:
    image: clamav/clamav:latest
    container_name: pec_clamav_dev
    restart: always
    ports:
      - "3310:3310"
    networks:
      - pec-network
    logging: *default-logging

  minio:
    image: minio/minio
    container_name: pec_minio_dev
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - pec-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc
    container_name: pec_minio_create_bucket_dev
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pec-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD};
      /usr/bin/mc mb myminio/pec-uploads --ignore-existing;
      /usr/bin/mc policy set download myminio/pec-uploads;
      exit 0;
      "

  prometheus:
    image: prom/prometheus:latest
    container_name: pec_prometheus_dev
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - pec-network

  grafana:
    image: grafana/grafana:latest
    container_name: pec_grafana_dev
    restart: always
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    networks:
      - pec-network
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: pec_loki_dev
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pec-network

  promtail:
    image: grafana/promtail:latest
    container_name: pec_promtail_dev
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - pec-network

volumes:
  postgres_dev_data:
  qdrant_dev_data:
  minio_dev_data:
  rabbitmq_dev_data:
  root_node_modules:
  pnpm_store_dev:
  server_node_modules:
  frontend_node_modules:
  database_node_modules:

networks:
  pec-network:
    driver: bridge
