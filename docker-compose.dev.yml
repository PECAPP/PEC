services:
  postgres:
    image: postgres:16-alpine
    container_name: pec_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "pec"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    container_name: pec_backend_dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: "pec_secret_key_2026"
      PORT: "4000"
      NODE_ENV: "development"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
      DB_HOST: "postgres"
      NODE_PATH: "/app/node_modules"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pec"
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - /app/apps/frontend
    command: >
      sh -c " corepack enable pnpm && pnpm install && npx prisma generate --schema packages/database/prisma/schema.prisma && npx prisma db push --schema packages/database/prisma/schema.prisma --accept-data-loss && cd apps/server && pnpm run start:dev "
    depends_on:
      - postgres

  frontend:
    image: node:22-alpine
    container_name: pec_frontend_dev
    profiles:
      - frontend
    working_dir: /app/apps/frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
      INTERNAL_API_URL: "http://backend:4000"
      GITHUB_AI_API_KEY: "${GITHUB_AI_API_KEY:-}"
      VITE_API_URL: "http://localhost:4000"
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../../:/app
      - frontend_node_modules:/app/apps/frontend/node_modules
    command: >
      sh -c " corepack enable pnpm && if [ ! -d node_modules/next ]; then pnpm install; fi && pnpm run dev -- --turbopack --hostname 0.0.0.0 --port 3000 "
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  backend_node_modules:
  frontend_node_modules:
